name: Clone Site

on:
  workflow_dispatch:

jobs:
  clone:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install playwright beautifulsoup4 Pillow
          python -m playwright install chromium --with-deps
      - name: Run clone script
        env:
          TARGET_URL: ${{ vars.TARGET_URL }}
          MARKER_TEXT: ${{ vars.MARKER_TEXT }}
          MAX_EDGE: ${{ vars.MAX_EDGE || '1200' }}
          QUALITY: ${{ vars.QUALITY || '78' }}
        run: xvfb-run --auto-servernum python3 clone.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-clone: ${{ vars.TARGET_URL }}" || echo "no changes"
          git push
